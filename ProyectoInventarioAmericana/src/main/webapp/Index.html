<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>INVENTARIOS PIZZA AMERICANA</title>
	<link href="css/bootstrap.min.css" rel="stylesheet" type="text/css" />
	<link href="css/all.min.css" rel="stylesheet" type="text/css" />
	<script type="text/javascript" src="js/jquery-1.11.0.min.js"></script>
	<script type="text/javascript" src="js/bootstrap.min.js"></script>
	<style>
		/* Misma paleta del logo que se usa en el proyecto de pedidos, pero aqui el
		   rojo es el dominante para que se sepa de una sola mirada en cual de los
		   dos sistemas se esta trabajando. */
		:root {
			--rojo-marca: #d0201f;
			--azul-marca: #20287f;
			--amarillo-marca: #f5c518;
		}

		html, body { height: 100%; }

		body {
			margin: 0;
			font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			background: #d0201f;
			background: linear-gradient(135deg, #a81817 0%, #d0201f 45%, #20287f 135%);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px 16px;
		}

		.tarjeta-ingreso {
			background: #fff;
			border-radius: 14px;
			box-shadow: 0 18px 45px rgba(0, 0, 0, .28);
			width: 100%;
			max-width: 400px;
			padding: 34px 32px 30px;
			text-align: center;
		}

		.tarjeta-ingreso img {
			width: 190px;
			max-width: 78%;
			height: auto;
			margin-bottom: 18px;
		}

		.tarjeta-ingreso h1 {
			font-size: 19px;
			font-weight: 600;
			color: var(--rojo-marca);
			margin: 0 0 4px;
			letter-spacing: .3px;
		}

		.tarjeta-ingreso .subtitulo {
			font-size: 13px;
			color: #8a8a8a;
			margin-bottom: 26px;
		}

		.campo { position: relative; margin-bottom: 14px; text-align: left; }

		.campo label {
			display: block;
			font-size: 12px;
			font-weight: 600;
			color: #6b6b6b;
			text-transform: uppercase;
			letter-spacing: .6px;
			margin-bottom: 5px;
		}

		.campo input {
			width: 100%;
			height: 44px;
			padding: 8px 12px 8px 38px;
			font-size: 15px;
			color: #333;
			border: 1px solid #d5d5d5;
			border-radius: 8px;
			background: #fbfbfb;
			transition: border-color .15s, box-shadow .15s, background .15s;
		}

		.campo input:focus {
			outline: none;
			background: #fff;
			border-color: var(--rojo-marca);
			box-shadow: 0 0 0 3px rgba(208, 32, 31, .13);
		}

		.campo .icono {
			position: absolute;
			left: 13px;
			top: 33px;
			color: #b3b3b3;
			font-size: 14px;
			pointer-events: none;
		}

		.campo input:focus + .icono { color: var(--rojo-marca); }

		.boton-ingresar {
			width: 100%;
			height: 46px;
			margin-top: 8px;
			font-size: 15px;
			font-weight: 600;
			letter-spacing: .4px;
			color: #fff;
			background: var(--rojo-marca);
			border: none;
			border-radius: 8px;
			cursor: pointer;
			transition: background .15s, transform .05s;
		}

		.boton-ingresar:hover { background: #b81c1b; }
		.boton-ingresar:active { transform: translateY(1px); }
		.boton-ingresar:disabled { background: #dd9a99; cursor: default; }

		#mensajeError {
			display: none;
			margin-top: 16px;
			margin-bottom: 0;
			padding: 10px 12px;
			font-size: 13px;
			text-align: left;
			border-radius: 8px;
			background: #fdecec;
			border: 1px solid #f3c2c2;
			color: #a11b1b;
		}

		.pie {
			margin-top: 22px;
			font-size: 11px;
			color: #b0b0b0;
			letter-spacing: .3px;
		}

		/* Franja con los colores de la marca, como remate superior de la tarjeta */
		.franja-marca {
			height: 5px;
			border-radius: 14px 14px 0 0;
			margin: -34px -32px 26px;
			background: linear-gradient(90deg,
				var(--rojo-marca) 0%, var(--rojo-marca) 33%,
				var(--amarillo-marca) 33%, var(--amarillo-marca) 66%,
				var(--azul-marca) 66%, var(--azul-marca) 100%);
		}

		@media (max-width: 380px) {
			.tarjeta-ingreso { padding: 26px 20px 24px; }
			.franja-marca { margin: -26px -20px 20px; }
		}
	</style>
</head>
<body>

	<div class="tarjeta-ingreso">
		<div class="franja-marca"></div>

		<img src="LogoPizzaAmericana.png" alt="Pizza Americana">
		<h1>Inventarios Pizza Americana</h1>
		<div class="subtitulo">Ingrese sus credenciales para continuar</div>

		<form id="formIngreso" onsubmit="return false;">
			<div class="campo">
				<label for="txtUsuario">Usuario</label>
				<input type="text" name="txtUsuario" id="txtUsuario" autocomplete="username"
					autocapitalize="none" spellcheck="false" autofocus>
				<span class="icono fas fa-user"></span>
			</div>

			<div class="campo">
				<label for="txtPassword">Contraseña</label>
				<input type="password" name="txtPassword" id="txtPassword" autocomplete="current-password">
				<span class="icono fas fa-lock"></span>
			</div>

			<button type="button" class="boton-ingresar" id="btnIngresar" onclick="autenticar()">Ingresar</button>
		</form>

		<div id="mensajeError"></div>

		<div class="pie">Pizza Americana &middot; Sistema de Inventarios</div>
	</div>

	<script type="text/javascript">

		$(function ()
		{
			//El Enter ahora sirve en los dos campos. Antes solo funcionaba estando
			//en la clave.
			$('#txtUsuario, #txtPassword').keypress(function (event) {
				if (event.which == 13) {
					autenticar();
				}
			});

			//Al volver a escribir se limpia el mensaje de error anterior
			$('#txtUsuario, #txtPassword').on('input', function () {
				$('#mensajeError').hide();
			});
		});

	</script>

	<script src="js/index.js" type="text/javascript"></script>
</body>
</html>
